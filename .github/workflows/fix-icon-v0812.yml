name: Fix bright iOS icon v0.8.12

on:
  push:
    paths:
      - '.github/workflows/fix-icon-v0812.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write verified bright icon and bump version
        run: |
          set -e
          cat > /tmp/icon.b64 <<'EOF'



EOF
          tr -d '\n' < /tmp/icon.b64 | base64 -d > apple-touch-icon-v0812.png
          cp apple-touch-icon-v0812.png apple-touch-icon.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('0.8.11','0.8.12')
          s=s.replace('href="apple-touch-icon.png"','href="apple-touch-icon-v0812.png"')
          s=s.replace('manifest.json?v=0.8.12','manifest-v0812.json?v=0.8.12')
          p.write_text(s)
          Path('version.json').write_text('{\n  "version": "0.8.12"\n}\n')
          Path('manifest-v0812.json').write_text('''{\n  "name": "ラブフェス！",\n  "short_name": "ラブフェス！",\n  "start_url": "./fresh-v0812.html",\n  "scope": "./",\n  "display": "standalone",\n  "orientation": "landscape",\n  "background_color": "#07101e",\n  "theme_color": "#07101e"\n}\n''')
          Path('fresh-v0812.html').write_text(s)
          PY
          file apple-touch-icon-v0812.png
          python3 - <<'PY'
          from pathlib import Path
          b=Path('apple-touch-icon-v0812.png').read_bytes()
          assert b.startswith(b'\x89PNG\r\n\x1a\n'), 'not a valid PNG header'
          assert len(b) > 10000, f'icon unexpectedly small: {len(b)} bytes'
          print('verified icon bytes:', len(b))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json manifest-v0812.json fresh-v0812.html apple-touch-icon.png apple-touch-icon-v0812.png
          git commit -m "Fix iOS app icon and bump to v0.8.12"
          git push
