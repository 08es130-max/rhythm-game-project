name: Fix bright iOS icon v0.8.12

on:
  push:
    paths:
      - '.github/workflows/fix-icon-v0812.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write verified bright icon and bump version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh api repos/${GITHUB_REPOSITORY}/git/blobs/baa93c0a47e00a9d73bbd3c094219b8c58f06e7f --jq .content | tr -d '\n' | base64 -d > apple-touch-icon-v0812.png
          cp apple-touch-icon-v0812.png apple-touch-icon.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          b=Path('apple-touch-icon-v0812.png').read_bytes()
          assert b.startswith(b'\x89PNG\r\n\x1a\n'), 'not a PNG'
          assert b.endswith(b'IEND\xaeB`\x82'), 'truncated PNG'
          w,h=struct.unpack('>II', b[16:24])
          assert (w,h)==(180,180), (w,h)
          print('verified PNG:', w, h, len(b), 'bytes')

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('0.8.11','0.8.12')
          s=s.replace('href="apple-touch-icon.png"','href="apple-touch-icon-v0812.png"')
          s=s.replace('manifest.json?v=0.8.12','manifest-v0812.json?v=0.8.12')
          p.write_text(s)
          Path('version.json').write_text('{\n  "version": "0.8.12"\n}\n')
          Path('manifest-v0812.json').write_text('''{
            "name": "ラブフェス！",
            "short_name": "ラブフェス！",
            "start_url": "./fresh-v0812.html",
            "scope": "./",
            "display": "standalone",
            "orientation": "landscape",
            "background_color": "#07101e",
            "theme_color": "#07101e"
          }
          ''')
          Path('fresh-v0812.html').write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json manifest-v0812.json fresh-v0812.html apple-touch-icon.png apple-touch-icon-v0812.png
          git commit -m "Fix iOS app icon and bump to v0.8.12"
          git push
