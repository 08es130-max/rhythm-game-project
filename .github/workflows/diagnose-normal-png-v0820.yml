name: Diagnose Shioriko normal art as PNG v0.8.20

on:
  push:
    paths:
      - '.github/workflows/diagnose-normal-png-v0820.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert current official normal WebP to PNG for iPhone diagnostic
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          dwebp assets/home-characters/shioriko/normal.webp -o assets/home-characters/shioriko/normal.png

      - name: Verify PNG and switch only normal mode to PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, struct

          png = Path('assets/home-characters/shioriko/normal.png')
          data = png.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', data[:8]
          assert data[12:16] == b'IHDR', data[12:16]
          width, height = struct.unpack('>II', data[16:24])
          assert (width, height) == (540, 720), (width, height)
          print('PNG verified:', width, height, len(data), hashlib.sha256(data).hexdigest())

          js_path = Path('home-cutout-v084.js')
          js = js_path.read_text(encoding='utf-8')
          old = "const ART=Object.fromEntries(VALID.map(mode=>[mode,`assets/home-characters/shioriko/${mode}.webp?v=${VERSION}`]));"
          new = "const ART=Object.fromEntries(VALID.map(mode=>[mode,`assets/home-characters/shioriko/${mode}.${mode==='normal'?'png':'webp'}?v=${VERSION}`]));"
          assert old in js, 'Expected ART mapping not found'
          js_path.write_text(js.replace(old, new, 1), encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_tag = '<script src="home-cutout-v084.js?v=0.8.20"></script>'
          new_tag = '<script src="home-cutout-v084.js?v=0.8.20-png1"></script>'
          assert old_tag in index, 'Expected home-cutout script tag not found'
          index_path.write_text(index.replace(old_tag, new_tag, 1), encoding='utf-8')
          PY

      - name: Commit PNG diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/home-characters/shioriko/normal.png home-cutout-v084.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Serve Shioriko normal art as PNG for iPhone diagnostic"
          git push
