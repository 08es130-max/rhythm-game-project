name: Replace Shioriko normal PNG with truecolor RGBA

on:
  push:
    paths:
      - '.github/workflows/replace-normal-rgba-v0820.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace normal PNG from staged base64 and verify
        run: |
          cat .art-transfer-clean-normal/*.b64 | base64 -d > assets/home-characters/shioriko/normal.png
          python - <<'PY'
          from pathlib import Path
          import struct, hashlib
          p=Path('assets/home-characters/shioriko/normal.png')
          b=p.read_bytes()
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          w,h=struct.unpack('>II',b[16:24])
          print('png', w, h, 'bytes', len(b), 'sha256', hashlib.sha256(b).hexdigest())
          assert (w,h)==(540,720)
          PY
          rm -rf .art-transfer-clean-normal
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/home-characters/shioriko/normal.png .art-transfer-clean-normal
          git diff --cached --quiet && exit 0
          git commit -m "Replace Shioriko normal PNG with clean RGBA asset"
          git push
