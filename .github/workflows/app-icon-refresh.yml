name: Refresh app icon

on:
  push:
    branches: [main]
    paths:
      - 'icon-180-v029.png.b64.txt'
      - '.github/workflows/app-icon-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build PNG icons and prepare 0.2.9
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import base64
          from pathlib import Path
          from PIL import Image

          raw = base64.b64decode(Path('icon-180-v029.png.b64.txt').read_text().strip())
          Path('icon-180-v029.png').write_bytes(raw)
          img = Image.open('icon-180-v029.png').convert('RGB')
          img.resize((192, 192), Image.Resampling.LANCZOS).save('icon-192.png', optimize=True)
          img.resize((512, 512), Image.Resampling.LANCZOS).save('icon-512.png', optimize=True)

          index = Path('index.html').read_text()
          index = index.replace('0.2.8', '0.2.9')
          index = index.replace('href="icon-192.png?v=0.2.9"', 'href="icon-180-v029.png?v=0.2.9"', 1)
          marker = '<script src="character-overrides.js?v=0.2.9"></script>'
          extra = marker + '\n  <script src="character-default-override.js?v=0.2.9"></script>'
          if 'character-default-override.js' not in index:
              index = index.replace(marker, extra)
          index = index.replace('キャラ変更に12人分のアイコンを追加しました。9レーンそれぞれに好きなキャラを選んで保存できます。', '修正版の栞子画像をアプリアイコンと初期キャラアイコンへ反映しました。')
          Path('index.html').write_text(index)
          Path('version.json').write_text('{\n  "version": "0.2.9"\n}\n')
          PY
      - name: Commit refreshed icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icon-180-v029.png icon-192.png icon-512.png index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m 'Release 0.2.9 with refreshed app icon'
          git push
