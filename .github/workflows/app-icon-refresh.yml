name: Refresh app icon

on:
  push:
    branches: [main]
    paths:
      - 'icon-180-v029.png.b64.txt'
      - '.github/workflows/app-icon-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build PNG icons from approved image
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import base64
          from pathlib import Path
          from PIL import Image
          src = Path('icon-180-v029.png.b64.txt')
          raw = base64.b64decode(src.read_text().strip())
          Path('icon-180-v029.png').write_bytes(raw)
          img = Image.open('icon-180-v029.png').convert('RGB')
          img.resize((192, 192), Image.Resampling.LANCZOS).save('icon-192.png', optimize=True)
          img.resize((512, 512), Image.Resampling.LANCZOS).save('icon-512.png', optimize=True)
          PY
      - name: Commit refreshed icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icon-180-v029.png icon-192.png icon-512.png
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh app icon artwork'
          git push
