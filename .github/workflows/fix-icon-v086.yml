name: Fix v0.8.6 app icon background

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-icon-v086.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create opaque navy-background icons
        run: |
          pip install pillow
          python - <<'PY'
          from PIL import Image
          from collections import deque

          src = Image.open('icon-512-v085.png').convert('RGB')
          px = src.load()
          w, h = src.size
          navy = (7, 16, 30)

          # Replace only the bright neutral outer backdrop connected to corners.
          q = deque([(0,0),(w-1,0),(0,h-1),(w-1,h-1)])
          seen = set()
          while q:
              x, y = q.popleft()
              if (x, y) in seen:
                  continue
              seen.add((x, y))
              r, g, b = px[x, y]
              mx, mn = max(r,g,b), min(r,g,b)
              if not (mn > 235 and (mx - mn) < 18):
                  continue
              px[x, y] = navy
              if x > 0: q.append((x-1, y))
              if x < w-1: q.append((x+1, y))
              if y > 0: q.append((x, y-1))
              if y < h-1: q.append((x, y+1))

          src.save('icon-512-v086.png', optimize=True)
          for size in (192, 180):
              out = src.resize((size, size), Image.Resampling.LANCZOS)
              out.save(f'icon-{size}-v086.png', optimize=True)
          PY
      - name: Update manifest and app version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('manifest.json').read_text())
          manifest['background_color'] = '#07101e'
          manifest['theme_color'] = '#07101e'
          manifest['icons'] = [
              {'src':'icon-192-v086.png','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'icon-512-v086.png','sizes':'512x512','type':'image/png','purpose':'any'}
          ]
          Path('manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          Path('version.json').write_text('{\n  "version": "0.8.6"\n}\n')

          p = Path('index.html')
          s = p.read_text()
          s = s.replace("window.APP_VERSION = '0.8.5';", "window.APP_VERSION = '0.8.6';")
          s = s.replace('manifest.json?v=0.8.5', 'manifest.json?v=0.8.6')
          s = s.replace('icon-180-v085.png?v=0.8.5', 'icon-180-v086.png?v=0.8.6')
          s = s.replace('icon-192-v085.png?v=0.8.5', 'icon-192-v086.png?v=0.8.6')
          s = s.replace('Ver. 0.8.5', 'Ver. 0.8.6')
          s = s.replace('Ver.0.8.5 アップデート', 'Ver.0.8.6 アップデート')
          s = s.replace('アプリアイコンとホームロゴを刷新し、新しい栞子立ち絵候補を追加しました。', 'アプリアイコンの背景表示を修正しました。')
          p.write_text(s)

          p = Path('home-cutout-v084.js')
          s = p.read_text().replace("const VERSION='0.8.5';", "const VERSION='0.8.6';")
          s = s.replace('Ver.0.8.5 アップデート', 'Ver.0.8.6 アップデート')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icon-512-v086.png icon-192-v086.png icon-180-v086.png manifest.json version.json index.html home-cutout-v084.js
          git commit -m 'Fix app icon background in v0.8.6'
          git pull --rebase origin main
          git push origin HEAD:main
