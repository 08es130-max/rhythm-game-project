name: Vendor lounge assets
on:
  push:
    paths:
      - '.github/workflows/vendor-lounge-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy verified mascot and live assets locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lounge/assets/mascot/live lounge/mini-live
          for id in ayumu kasumi shizuku karin ai kanata setsuna emma rina shioriko mia lanzhu yu; do
            curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/08es130-max/love-poke-tools/main/assets/mascot/${id}-sprite.png" -o "lounge/assets/mascot/${id}-sprite.png"
            test "$(wc -c < "lounge/assets/mascot/${id}-sprite.png")" -gt 1000
          done
          curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/08es130-max/love-poke-tools/main/assets/mascot/live/yu-cheer-8frames-transparent-padded.png" -o lounge/assets/mascot/live/yu-cheer-8frames-transparent-padded.png
          test "$(wc -c < lounge/assets/mascot/live/yu-cheer-8frames-transparent-padded.png)" -gt 1000
          for id in ayumu kasumi shizuku karin ai kanata setsuna emma rina shioriko mia lanzhu; do
            curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/08es130-max/love-poke-tools/main/mini-live/${id}-frames.json" -o "lounge/mini-live/${id}-frames.json"
            python3 -m json.tool "lounge/mini-live/${id}-frames.json" >/dev/null
          done
      - name: Switch references only after all assets verified
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lounge/mascot-multi.js')
          s=p.read_text()
          s=s.replace('https://08es130-max.github.io/love-poke-tools/assets/mascot/','./assets/mascot/')
          s=s.replace('https://08es130-max.github.io/love-poke-tools/mini-live/','./mini-live/')
          p.write_text(s)
          p=Path('lounge/mascot.css')
          s=p.read_text().replace('https://08es130-max.github.io/love-poke-tools/assets/mascot/','./assets/mascot/')
          p.write_text(s)
          p=Path('lounge/sw.js')
          s=p.read_text().replace("hobofes-lounge-assets-v5","hobofes-lounge-assets-v6")
          p.write_text(s)
          PY
      - name: Commit vendored assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lounge/assets/mascot lounge/mini-live lounge/mascot-multi.js lounge/mascot.css lounge/sw.js
          git diff --cached --quiet || (git commit -m "Vendor mascot and mini-live assets into 2D lounge" && git push)
