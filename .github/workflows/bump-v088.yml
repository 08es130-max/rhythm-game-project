name: Bump v0.8.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-v088.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update version references
        run: |
          python - <<'PY'
          from pathlib import Path
          files = ['index.html','home-branding-v085.js']
          for fn in files:
              p=Path(fn)
              s=p.read_text()
              s=s.replace('0.8.7','0.8.8')
              p.write_text(s)
          Path('version.json').write_text('{\n  "version": "0.8.8"\n}\n')
          PY
      - name: Commit version bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html home-branding-v085.js version.json
          git commit -m 'Bump app version to 0.8.8'
          git push origin HEAD:main
