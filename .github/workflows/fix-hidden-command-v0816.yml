name: Fix hidden command v0.8.16

on:
  push:
    paths:
      - '.github/workflows/fix-hidden-command-v0816.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix hidden command trigger and bump version
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          p=Path('home-branding-v085.css')
          s=p.read_text()
          s=s.replace('  display:flex;\n  align-items:flex-start;\n}', '  display:flex;\n  align-items:flex-start;\n  pointer-events:auto;\n  touch-action:manipulation;\n}')
          s=s.replace('  pointer-events:none;\n}\n@media (max-height:520px)', '  pointer-events:auto;\n  touch-action:manipulation;\n}\n@media (max-height:520px)')
          if '.home-lovefes-logo-v085{' in s and 'cursor:pointer' not in s:
              s=s.replace('  -webkit-user-drag:none;\n}', '  -webkit-user-drag:none;\n  pointer-events:auto;\n  touch-action:manipulation;\n  cursor:pointer;\n}')
          p.write_text(s)

          p=Path('hidden-admin-v048.js')
          s=p.read_text()
          s=s.replace('// Ver.0.4.8 hidden owner room. No visible entry point is added to the home screen.', '// Ver.0.8.16 hidden owner room. Secret command uses version taps + visible LoveFes logo hold.')
          s=s.replace("const title=document.querySelector('.home-title');", "const title=document.querySelector('.home-topbar > div:first-child');")
          p.write_text(s)

          for name in ['index.html','fresh-v0815.html']:
              p=Path(name)
              s=p.read_text()
              s=s.replace('0.8.15','0.8.16')
              s=s.replace('hidden-admin-v048.js?v=0.5.7','hidden-admin-v048.js?v=0.8.16')
              s=s.replace('home-branding-v085.css?v=0.8.5','home-branding-v085.css?v=0.8.16')
              s=s.replace('栞子の通常立ち絵と隠しモード全7種を、新しい左右補完済み立ち絵へ差し替えました。','隠しコマンドのタップ判定を修正し、Ver.表示6回タップ後に左上ロゴを長押しすると管理人の隠し部屋を開けるようにしました。')
              p.write_text(s)

          Path('version.json').write_text('{\n  "version": "0.8.16"\n}\n')
          PY

          grep -q "window.APP_VERSION = '0.8.16'" index.html
          grep -q 'hidden-admin-v048.js?v=0.8.16' index.html
          grep -q 'home-branding-v085.css?v=0.8.16' index.html
          grep -q "document.querySelector('.home-topbar > div:first-child')" hidden-admin-v048.js
          grep -q 'pointer-events:auto' home-branding-v085.css

      - name: Commit v0.8.16 hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hidden-admin-v048.js home-branding-v085.css index.html fresh-v0815.html version.json
          git commit -m "Fix hidden command trigger v0.8.16"
          git push

# retrigger 2
