name: Apply official Shioriko high-res normal art v0.8.20

on:
  push:
    paths:
      - '.github/workflows/apply-normal-art-v0820.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild official normal art
        run: |
          cat .art-transfer-v0820/normal-*.b64 > /tmp/normal.b64
          base64 -d /tmp/normal.b64 > assets/home-characters/shioriko/normal.webp
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/home-characters/shioriko/normal.webp')
          b=p.read_bytes()
          assert len(b)==110352, len(b)
          assert b[:4]==b'RIFF', b[:4]
          assert b[8:12]==b'WEBP', b[8:12]
          print('valid webp bytes:', len(b))
          PY
          rm -rf .art-transfer-v0820
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/home-characters/shioriko/normal.webp .art-transfer-v0820
          git diff --cached --quiet && exit 0
          git commit -m "Restore official high-resolution Shioriko normal art"
          git push
