name: Fix version display v0.8.11

on:
  push:
    paths:
      - '.github/workflows/fix-version-display-v0811.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix stale version overrides and create fresh entry
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          VERSION='0.8.11'

          # Fix legacy scripts that were overwriting the visible app version.
          p=Path('home-cutout-v084.js')
          s=p.read_text()
          s=s.replace("const VERSION='0.8.6';", "const VERSION=window.APP_VERSION || '0.8.11';")
          p.write_text(s)

          p=Path('fixes-v051.js')
          s=p.read_text()
          s=s.replace("const VERSION='0.6.7';", "const VERSION=window.APP_VERSION || '0.8.11';")
          p.write_text(s)

          # Branding asset cache version should follow the canonical app version too.
          p=Path('home-branding-v085.js')
          s=p.read_text()
          s=s.replace("const VERSION='0.8.9';", "const VERSION=window.APP_VERSION || '0.8.11';")
          p.write_text(s)

          # Final guard: no legacy script may leave an older visible version behind.
          Path('version-display-lock-v0811.js').write_text(r'''(function(){
  function sync(){
    const v=window.APP_VERSION || '0.8.11';
    document.querySelectorAll('.home-version,.version-badge').forEach(el=>{
      const text=`Ver. ${v}`;
      if(el.textContent!==text) el.textContent=text;
    });
    const head=document.querySelector('#updateBanner .update-head span:last-child');
    if(head){
      const text=`Ver.${v} アップデート`;
      if(head.textContent!==text) head.textContent=text;
    }
  }
  sync();
  requestAnimationFrame(sync);
  setTimeout(sync,100);
  setTimeout(sync,300);
  const observer=new MutationObserver(sync);
  observer.observe(document.body,{subtree:true,childList:true,characterData:true});
})();
''')

          # Canonical page.
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('0.8.10','0.8.11')
          s=s.replace('fixes-v051.js?v=0.8.2','fixes-v051.js?v=0.8.11')
          s=s.replace('home-cutout-v084.js?v=0.8.5','home-cutout-v084.js?v=0.8.11')
          s=s.replace('home-branding-v085.js?v=0.8.5','home-branding-v085.js?v=0.8.11')
          if 'version-display-lock-v0811.js' not in s:
            s=s.replace('</body>','<script src="version-display-lock-v0811.js?v=0.8.11"></script>\n</body>')
          p.write_text(s)
          Path('version.json').write_text('{\n  "version": "0.8.11"\n}\n')

          # New URL so Safari cannot reuse the old document cache.
          fresh=Path('index.html').read_text()
          fresh=fresh.replace('manifest.json?v=0.8.11','manifest-v0810.json?v=0.8.11')
          fresh=fresh.replace('href="apple-touch-icon.png"','href="apple-touch-icon-v0810.png"')
          fresh=fresh.replace('href="icon-192.png"','href="icon-192-v0810.png"')
          fresh=fresh.replace('</head>','<script>window.__FRESH_ENTRY_V0811__=true;</script>\n</head>')
          Path('fresh-v0811.html').write_text(fresh)
          PY

      - name: Commit v0.8.11 fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json fresh-v0811.html home-cutout-v084.js fixes-v051.js home-branding-v085.js version-display-lock-v0811.js
          git commit -m "Fix stale version overrides and bump to v0.8.11"
          git push
