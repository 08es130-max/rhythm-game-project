name: Publish v0.8.5 final branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v085-final.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index and manifest cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('manifest.json?v=0.5.7','manifest.json?v=0.8.5')
          if 'home-branding-v085.css?v=0.8.5' not in s:
              s=s.replace('<link rel="stylesheet" href="home-cutout-v084.css?v=0.8.5" />', '<link rel="stylesheet" href="home-cutout-v084.css?v=0.8.5" />\n<link rel="stylesheet" href="home-branding-v085.css?v=0.8.5" />')
          if 'home-branding-v085.js?v=0.8.5' not in s:
              s=s.replace('<script src="home-cutout-v084.js?v=0.8.5"></script>', '<script src="home-cutout-v084.js?v=0.8.5"></script>\n<script src="home-branding-v085.js?v=0.8.5"></script>')
          s=s.replace('<p class="update-text">アプリアイコンとホームロゴを刷新し、新しい栞子立ち絵候補を追加しました。</p>', '<p class="update-text">新しいアプリアイコンとホーム左上の「ラブフェス！」ロゴ、栞子の新しい立ち絵候補を追加しました。</p>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Finalize v0.8.5 home branding'
          git pull --rebase origin main
          git push origin HEAD:main
