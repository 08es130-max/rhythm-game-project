name: Generate v0.8.5 icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-v085-icons.yml'
      - 'icon-512-v085.png'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate 180 and 192 icons
        run: |
          pip install pillow
          python - <<'PY'
          from PIL import Image
          img = Image.open('icon-512-v085.png').convert('RGBA')
          for size in (180, 192):
              out = img.resize((size, size), Image.Resampling.LANCZOS)
              out.save(f'icon-{size}-v085.png', optimize=True)
          PY
      - name: Commit generated icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icon-180-v085.png icon-192-v085.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Generate v0.8.5 app icon sizes'
          git pull --rebase origin main
          git push origin HEAD:main
