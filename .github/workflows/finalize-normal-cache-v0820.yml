name: Finalize Shioriko normal cache keys

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-normal-cache-v0820.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify normal PNG and bump cache keys
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, struct
          p=Path('assets/home-characters/shioriko/normal.png')
          b=p.read_bytes()
          assert b[:8] == b'\x89PNG\r\n\x1a\n', 'bad PNG signature'
          w,h=struct.unpack('>II', b[16:24])
          sha=hashlib.sha256(b).hexdigest()
          print('normal.png', len(b), w, h, sha)
          assert (w,h)==(540,720), (w,h)
          assert len(b)==75792, len(b)
          assert sha=='f94bfb65d84ff6741ece4a03c15d0b1408c71f397dcef5cdc0086a706433526a', sha

          js=Path('home-cutout-v084.js')
          s=js.read_text()
          assert '0.8.20-clean3' in s
          js.write_text(s.replace('0.8.20-clean3','0.8.20-clean4'))

          idx=Path('index.html')
          s=idx.read_text()
          assert 'home-cutout-v084.js?v=0.8.20-png3' in s
          idx.write_text(s.replace('home-cutout-v084.js?v=0.8.20-png3','home-cutout-v084.js?v=0.8.20-png4'))
          PY
      - name: Commit cache-key update
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add home-cutout-v084.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize Shioriko normal PNG cache keys'
          git push
