name: Generate home character cutouts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-home-cutouts.yml'
      - 'icon-512-v030.png'
      - 'assets/shioriko-expressions/dere-v058.png'
      - 'assets/shioriko-expressions/yandere-v058.png'
      - 'assets/shioriko-expressions/scold-v058.png'
      - 'assets/shioriko-expressions/drunk-v058.png'
      - 'assets/shioriko-expressions/clumsy-v058.png'
      - 'assets/shioriko-expressions/casual-v058.png'
      - 'assets/home-live-v042.webp'
      - 'assets/home-settings-v042.webp'
      - 'assets/home-room-v042.webp'
      - 'assets/home-gacha-v042.webp'

permissions:
  contents: write

jobs:
  cutout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install background remover
        run: |
          python -m pip install --upgrade pip
          pip install rembg onnxruntime pillow
      - name: Generate transparent PNGs
        run: |
          python - <<'PY'
          from pathlib import Path
          from rembg import remove
          from PIL import Image
          import io

          character_out = Path('assets/home-characters/shioriko')
          ui_out = Path('assets/home-ui')
          character_out.mkdir(parents=True, exist_ok=True)
          ui_out.mkdir(parents=True, exist_ok=True)

          files = {
              character_out / 'normal.png': Path('icon-512-v030.png'),
              character_out / 'dere.png': Path('assets/shioriko-expressions/dere-v058.png'),
              character_out / 'yandere.png': Path('assets/shioriko-expressions/yandere-v058.png'),
              character_out / 'scold.png': Path('assets/shioriko-expressions/scold-v058.png'),
              character_out / 'drunk.png': Path('assets/shioriko-expressions/drunk-v058.png'),
              character_out / 'clumsy.png': Path('assets/shioriko-expressions/clumsy-v058.png'),
              character_out / 'casual.png': Path('assets/shioriko-expressions/casual-v058.png'),
              ui_out / 'live.png': Path('assets/home-live-v042.webp'),
              ui_out / 'settings.png': Path('assets/home-settings-v042.webp'),
              ui_out / 'room.png': Path('assets/home-room-v042.webp'),
              ui_out / 'gacha.png': Path('assets/home-gacha-v042.webp'),
          }

          for dest, src in files.items():
              result = remove(src.read_bytes(), alpha_matting=True,
                              alpha_matting_foreground_threshold=240,
                              alpha_matting_background_threshold=10,
                              alpha_matting_erode_size=8)
              img = Image.open(io.BytesIO(result)).convert('RGBA')
              img.save(dest, optimize=True)
              print(src, '->', dest, img.size)
          PY
      - name: Commit generated assets
        run: |
          if git status --porcelain assets/home-characters/shioriko assets/home-ui | grep .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/home-characters/shioriko assets/home-ui
            git commit -m 'Generate transparent home assets'
            git push
          else
            echo 'No generated changes.'
          fi
