name: Generate home character cutouts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-home-cutouts.yml'

permissions:
  contents: write

jobs:
  cutout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install background remover
        run: |
          python -m pip install --upgrade pip
          pip install rembg onnxruntime pillow
      - name: Generate transparent menu PNGs
        run: |
          python - <<'PY'
          from pathlib import Path
          from rembg import remove, new_session
          from PIL import Image
          import io

          ui_out = Path('assets/home-ui')
          ui_out.mkdir(parents=True, exist_ok=True)
          session = new_session('u2netp')
          files = {
              ui_out / 'live.png': Path('assets/home-live-v042.webp'),
              ui_out / 'settings.png': Path('assets/home-settings-v042.webp'),
              ui_out / 'room.png': Path('assets/home-room-v042.webp'),
              ui_out / 'gacha.png': Path('assets/home-gacha-v042.webp'),
          }
          for dest, src in files.items():
              result = remove(src.read_bytes(), session=session, alpha_matting=True,
                              alpha_matting_foreground_threshold=240,
                              alpha_matting_background_threshold=10,
                              alpha_matting_erode_size=4)
              Image.open(io.BytesIO(result)).convert('RGBA').save(dest, optimize=True)
              print(src, '->', dest)
          PY
      - name: Commit generated assets
        run: |
          if git status --porcelain assets/home-ui | grep .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/home-ui
            git commit -m 'Generate transparent home menu assets'
            git pull --rebase origin main
            git push origin main
          else
            echo 'No generated changes.'
          fi
