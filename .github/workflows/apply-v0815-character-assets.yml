name: Apply Shioriko standing art assets v0.8.15

on:
  push:
    paths:
      - '.github/workflows/apply-v0815-character-assets.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and install all seven standing arts
        run: |
          set -e
          mkdir -p assets/home-characters/shioriko
          for mode in normal dere yandere scold drunk clumsy casual; do
            base64 -d ".v0814-assets/direct-${mode}.b64" > "assets/home-characters/shioriko/${mode}.webp"
            test -s "assets/home-characters/shioriko/${mode}.webp"
            python3 - "$mode" <<'PY'
import pathlib,sys
mode=sys.argv[1]
p=pathlib.Path(f'assets/home-characters/shioriko/{mode}.webp')
b=p.read_bytes()
assert b[:4] == b'RIFF' and b[8:12] == b'WEBP', f'{mode}: invalid WEBP'
print(mode, len(b))
PY
          done

          python3 - <<'PY'
from pathlib import Path

p=Path('home-cutout-v084.js')
s=p.read_text()
s=s.replace("window.APP_VERSION || '0.8.14'","window.APP_VERSION || '0.8.15'")
s=s.replace("window.APP_VERSION || '0.8.11'","window.APP_VERSION || '0.8.15'")
s=s.replace("`assets/home-characters/shioriko/${mode}.png?v=${VERSION}`","`assets/home-characters/shioriko/${mode}.webp?v=${VERSION}`")
s=s.replace('栞子の通常立ち絵と隠しモード全種を大きく表示し、頭が左上ロゴより低くなるよう配置を調整しました。','栞子の通常立ち絵と隠しモード全7種を新しい左右補完済み立ち絵へ差し替えました。')
p.write_text(s)

p=Path('index.html')
s=p.read_text()
s=s.replace('0.8.14','0.8.15')
s=s.replace('栞子の通常立ち絵と隠しモード全種を大きく表示し、頭が左上ロゴより低くなるよう配置を調整しました。','栞子の通常立ち絵と隠しモード全7種を新しい左右補完済み立ち絵へ差し替えました。')
p.write_text(s)
Path('fresh-v0815.html').write_text(s)
Path('version.json').write_text('{\n  "version": "0.8.15"\n}\n')

p=Path('fixes-v051.js')
f=p.read_text().replace("window.APP_VERSION || '0.8.14'","window.APP_VERSION || '0.8.15'").replace("window.APP_VERSION || '0.8.11'","window.APP_VERSION || '0.8.15'")
p.write_text(f)
PY

      - name: Commit installed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/home-characters/shioriko/*.webp home-cutout-v084.js fixes-v051.js index.html fresh-v0815.html version.json
          git commit -m "Replace Shioriko standing art in all modes v0.8.15"
          git push
