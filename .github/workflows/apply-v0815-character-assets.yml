name: Apply Shioriko standing art assets v0.8.15

on:
  push:
    paths:
      - '.github/workflows/apply-v0815-character-assets.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and install all seven standing arts
        run: |
          set -e
          mkdir -p assets/home-characters/shioriko
          for mode in normal dere yandere scold drunk clumsy casual; do
            base64 -d ".v0814-assets/direct-${mode}.b64" > "assets/home-characters/shioriko/${mode}.webp"
            test -s "assets/home-characters/shioriko/${mode}.webp"
            python3 -c "import pathlib,sys; b=pathlib.Path(sys.argv[1]).read_bytes(); assert b[:4]==b'RIFF' and b[8:12]==b'WEBP'" "assets/home-characters/shioriko/${mode}.webp"
          done
          sed -i "s/window.APP_VERSION || '0.8.14'/window.APP_VERSION || '0.8.15'/g; s/window.APP_VERSION || '0.8.11'/window.APP_VERSION || '0.8.15'/g; s#assets/home-characters/shioriko/\${mode}\.png#assets/home-characters/shioriko/\${mode}.webp#g" home-cutout-v084.js
          sed -i "s/0.8.14/0.8.15/g" index.html fixes-v051.js
          sed -i "s/栞子の通常立ち絵と隠しモード全種を大きく表示し、頭が左上ロゴより低くなるよう配置を調整しました。/栞子の通常立ち絵と隠しモード全7種を新しい左右補完済み立ち絵へ差し替えました。/g" index.html home-cutout-v084.js
          cp index.html fresh-v0815.html
          printf '{\n  "version": "0.8.15"\n}\n' > version.json
      - name: Commit installed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/home-characters/shioriko/*.webp home-cutout-v084.js fixes-v051.js index.html fresh-v0815.html version.json
          git commit -m "Replace Shioriko standing art in all modes v0.8.15"
          git push
