name: Apply home layering v0.8.13

on:
  push:
    paths:
      - '.github/workflows/home-layering-v0813.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch home entry files
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('0.8.12','0.8.13')
          marker='<link rel="stylesheet" href="home-branding-v085.css?v=0.8.5" />'
          extra='\n<link rel="stylesheet" href="home-layering-v0813.css?v=0.8.13" />'
          if 'home-layering-v0813.css' not in s:
              s=s.replace(marker, marker+extra)
          s=s.replace('新しいアプリアイコンとホーム左上の「ラブフェス！」ロゴ、栞子の新しい立ち絵候補を追加しました。','ホーム左上のロゴを完全透過レイヤーとして前面にし、栞子の立ち絵が背面から自然に見えるよう配置を調整しました。')
          p.write_text(s)

          Path('version.json').write_text('{\n  "version": "0.8.13"\n}\n')

          # Keep the dedicated fresh URL available for iOS/Safari checks.
          Path('fresh-v0813.html').write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json fresh-v0813.html
          git commit -m "Apply transparent logo layering v0.8.13"
          git push
