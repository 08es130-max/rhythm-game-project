name: Build unified home icons

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_home_icons.py'
      - 'interaction-room-v0844.js'
      - 'assets/home-ui/live.png'
      - 'assets/home-ui/settings.png'
      - 'assets/home-ui/room.png'
      - 'assets/home-ui/gacha.png'
      - 'assets/ui/story-icon-v0833.png'
      - '.github/workflows/build-home-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/build_home_icons.py
      - name: Commit generated icons
        run: |
          if git diff --quiet -- assets/ui/home-v0855; then
            echo "No icon changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/home-v0855
          git commit -m "Generate unified high-resolution home icons"
          git push
