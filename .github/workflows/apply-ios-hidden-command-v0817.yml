name: Apply iOS hidden command v0.8.17

on:
  push:
    paths:
      - '.github/workflows/apply-ios-hidden-command-v0817.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump app and cache references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['index.html','fresh-v0815.html']:
              p=Path(name)
              s=p.read_text()
              s=s.replace('0.8.16','0.8.17')
              p.write_text(s)
          Path('version.json').write_text('{\n  "version": "0.8.17"\n}\n')
          PY
          grep -q "window.APP_VERSION = '0.8.17'" index.html
          grep -q 'home-branding-v085.css?v=0.8.17' index.html
          grep -q 'hidden-admin-v048.js?v=0.8.17' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fresh-v0815.html version.json
          git commit -m "Bump iOS hidden command fix to v0.8.17"
          git push
