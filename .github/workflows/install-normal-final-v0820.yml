name: Install verified Shioriko normal PNG

# retry after verified chunk repair
on:
  push:
    branches:
      - transfer-normal-final
    paths:
      - '.github/workflows/install-normal-final-v0820.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify official Shioriko PNG
        run: |
          set -euo pipefail
          cat .art-transfer-normal-final8/*.b64 | base64 -d > assets/home-characters/shioriko/normal.png
          python - <<'PY'
          from pathlib import Path
          import hashlib, struct
          p=Path('assets/home-characters/shioriko/normal.png')
          b=p.read_bytes()
          assert b[:8] == b'\x89PNG\r\n\x1a\n', 'bad PNG signature'
          w,h=struct.unpack('>II', b[16:24])
          sha=hashlib.sha256(b).hexdigest()
          print('size=', len(b))
          print('dimensions=', w, h)
          print('sha256=', sha)
          assert (w,h)==(540,720), (w,h)
          assert len(b)==75792, len(b)
          assert sha=='f94bfb65d84ff6741ece4a03c15d0b1408c71f397dcef5cdc0086a706433526a', sha
          PY
          rm -rf .art-transfer-normal-final8
      - name: Commit verified asset
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/home-characters/shioriko/normal.png .art-transfer-normal-final8
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Install verified Shioriko normal PNG'
          git push
