<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="9-Lane Rhythm" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>9-Lane Rhythm Prototype</title>
  <link rel="manifest" href="manifest.json?v=0.1.1" />
  <link rel="apple-touch-icon" href="icon-192.png?v=0.1.1" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=0.1.1" />
  <link rel="stylesheet" href="styles.css?v=0.1.1" />
  <link rel="stylesheet" href="touch-guards.css?v=0.1.1" />
  <link rel="stylesheet" href="pause.css?v=0.1.1" />
  <script>
    window.APP_VERSION = '0.1.1';
    (async () => {
      try {
        const response = await fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) return;
        const data = await response.json();
        if (data.version && data.version !== window.APP_VERSION) {
          const url = new URL(window.location.href);
          url.searchParams.set('v', data.version);
          window.location.replace(url.toString());
        }
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <main class="app-shell">
    <section class="panel controls" id="controlsPanel">
      <div class="version-badge" aria-label="app version">Ver. 0.1.1</div>
      <h1>9-Lane Rhythm Prototype</h1>
      <p class="sub">ローカル音源＋譜面JSONで遊ぶ試作版です。</p>

      <div class="file-row">
        <label>音源モード
          <select id="audioMode">
            <option value="silent" selected>テスト用（無音）</option>
            <option value="file">ファイル音源</option>
          </select>
        </label>
        <label>音源ファイル
          <input id="audioFile" type="file" accept="audio/*" />
        </label>
        <label>譜面JSON
          <input id="chartFile" type="file" accept="application/json,.json" />
        </label>
      </div>

      <div class="settings-row">
        <label>ノーツ速度
          <input id="speed" type="range" min="0.7" max="2.0" step="0.1" value="1.0" />
          <span id="speedValue">1.0x</span>
        </label>
        <label>オフセット(ms)
          <input id="offset" type="number" step="10" value="0" />
        </label>
      </div>

      <div class="button-row">
        <button id="startBtn" disabled>START</button>
        <button id="stopBtn" disabled>STOP</button>
        <button id="demoBtn">テスト譜面を使う</button>
      </div>

      <div class="meta-row">
        <div>曲: <strong id="songName">テスト用（無音）</strong></div>
        <div>譜面: <strong id="chartName">未選択</strong></div>
      </div>
    </section>

    <section class="game-wrap">
      <div class="hud">
        <div><span class="hud-label">SCORE</span><span id="score">0</span></div>
        <div><span class="hud-label">COMBO</span><span id="combo">0</span></div>
        <div id="judge" class="judge">READY</div>
      </div>

      <div id="game" class="game" aria-label="9 lane rhythm game">
        <div id="laneLayer" class="lane-layer"></div>
        <div id="comboOverlay" class="combo-overlay" hidden>
          <span id="comboCount" class="combo-count">0</span>
          <span class="combo-text">combo</span>
        </div>
        <div id="notesLayer" class="notes-layer"></div>
        <div class="judge-line"></div>
        <div id="targets" class="targets"></div>
      </div>

      <div class="key-guide">A　S　D　F　SPACE　J　K　L　;</div>
    </section>

    <section class="panel result" id="resultPanel" hidden>
      <h2>RESULT</h2>
      <div class="result-grid">
        <div>PERFECT <strong id="rPerfect">0</strong></div>
        <div>GREAT <strong id="rGreat">0</strong></div>
        <div>GOOD <strong id="rGood">0</strong></div>
        <div>MISS <strong id="rMiss">0</strong></div>
        <div>MAX COMBO <strong id="rMaxCombo">0</strong></div>
        <div>SCORE <strong id="rScore">0</strong></div>
      </div>
      <div class="result-actions">
        <button id="retryBtn">もう一度</button>
        <button id="backBtn">選択画面に戻る</button>
      </div>
    </section>
  </main>

  <audio id="audio" preload="auto"></audio>
  <script src="app.js?v=0.1.1"></script>
  <script src="touch-guards.js?v=0.1.1"></script>
  <script src="pause.js?v=0.1.1"></script>
</body>
</html>
