<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ストーリー">
<defs>
  <linearGradient id="bookL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#dff7ff"/></linearGradient>
  <linearGradient id="bookR" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#fffafc"/><stop offset="1" stop-color="#f6e7ff"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#68e3ff"/><stop offset=".48" stop-color="#8b7dff"/><stop offset="1" stop-color="#ff74cf"/></linearGradient>
  <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff9ada"/><stop offset="1" stop-color="#ff4eac"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5a0"/><stop offset=".45" stop-color="#ffd13f"/><stop offset="1" stop-color="#ff9f35"/></linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#08162f" flood-opacity=".6"/></filter>
  <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<!-- loose glow, not a square card -->
<g opacity=".74" filter="url(#softglow)" fill="none" stroke="url(#edge)" stroke-width="18">
  <path d="M98 183c16-54 68-89 119-74 34-28 89-27 124 2 52-11 101 28 108 80 34 35 27 91-12 118-1 47-43 84-90 79-36 25-88 20-118-13-45 12-93-14-104-60-43-22-57-79-27-116z"/>
</g>

<!-- book -->
<g filter="url(#shadow)">
  <path d="M103 164c47-26 97-21 153 17v179c-49-35-101-37-153-11z" fill="url(#bookL)" stroke="#ffffff" stroke-width="11" stroke-linejoin="round"/>
  <path d="M409 164c-47-26-97-21-153 17v179c49-35 101-37 153-11z" fill="url(#bookR)" stroke="#ffffff" stroke-width="11" stroke-linejoin="round"/>
  <path d="M103 164c47-26 97-21 153 17M409 164c-47-26-97-21-153 17" fill="none" stroke="url(#edge)" stroke-width="9" stroke-linecap="round"/>
  <path d="M256 181v179" stroke="#7897ff" stroke-width="7" stroke-linecap="round"/>
</g>

<!-- page decoration -->
<g fill="none" stroke="#8f85d9" stroke-width="6" stroke-linecap="round" opacity=".55">
  <path d="M145 223h65M145 251h73M145 279h52"/>
  <path d="M301 223h65M301 251h73M301 279h52"/>
</g>

<!-- ribbon bookmark -->
<path d="M246 166h21l-1 109-10 14-11-14z" fill="url(#ribbon)" stroke="#fff" stroke-width="4"/>

<!-- pen -->
<g transform="rotate(-26 365 286)" filter="url(#shadow)">
  <rect x="354" y="221" width="18" height="108" rx="9" fill="#62cfff" stroke="#fff" stroke-width="5"/>
  <path d="M354 329h18l-9 28z" fill="url(#gold)" stroke="#fff" stroke-width="4"/>
</g>

<!-- stars and notes -->
<g filter="url(#softglow)">
  <path d="M101 119l8 20 21 2-16 14 5 21-18-11-19 11 6-21-17-14 22-2z" fill="url(#gold)" stroke="#fff" stroke-width="4"/>
  <path d="M413 117l7 18 19 2-15 12 5 19-16-10-17 10 5-19-14-12 19-2z" fill="#ff75cb" stroke="#fff" stroke-width="4"/>
  <path d="M129 92v42m0-2c-16-8-27 1-22 11 5 9 22 5 22-11zm19-53v42m0-2c-16-8-27 1-22 11 5 9 22 5 22-11z" fill="#71e2ff" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <path d="M92 260l7 17 17 7-17 7-7 17-7-17-17-7 17-7zM421 260l6 15 15 6-15 6-6 15-6-15-15-6 15-6z" fill="#fff"/>
</g>

<!-- label like the other game buttons: bold rounded Japanese with double outline -->
<text x="256" y="436" text-anchor="middle" font-family="'Hiragino Maru Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-weight="900" font-size="58" letter-spacing="-3" fill="#fff" stroke="#173f91" stroke-width="18" paint-order="stroke">ストーリー</text>
<text x="256" y="436" text-anchor="middle" font-family="'Hiragino Maru Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-weight="900" font-size="58" letter-spacing="-3" fill="#eefcff" stroke="#66d8ff" stroke-width="7" paint-order="stroke">ストーリー</text>
</svg>