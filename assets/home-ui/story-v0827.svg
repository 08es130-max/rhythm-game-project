<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ストーリー">
<defs>
  <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8fd8"/><stop offset=".45" stop-color="#c86cff"/><stop offset="1" stop-color="#6d7cff"/></linearGradient>
  <linearGradient id="cover2" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffb6e8"/><stop offset="1" stop-color="#8ba5ff"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff6ad"/><stop offset=".42" stop-color="#ffd35d"/><stop offset="1" stop-color="#ff9c45"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8fbff"/><stop offset="1" stop-color="#52d7ff"/></linearGradient>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#07142c" flood-opacity=".62"/></filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<!-- detached sparkle halo -->
<g filter="url(#glow)">
  <path d="M95 159c21-40 57-65 101-66 34-26 91-31 130-6 48-5 92 23 108 65 34 23 47 69 29 106 13 43-11 91-52 107-23 39-72 58-114 44-41 20-94 10-126-22-45 5-88-23-101-65-36-26-46-77-23-114-8-19-4-34 8-49z" fill="none" stroke="#7ddcff" stroke-width="14" opacity=".48"/>
  <path d="M114 145c28-35 72-51 115-39 39-19 88-16 121 12 46 5 81 37 91 80 27 31 30 79 4 113-6 41-39 76-80 83-35 27-87 30-124 8-43 11-89-9-111-47-43-11-73-49-73-93-20-37-7-84 27-109 3-3 6-6 10-8z" fill="none" stroke="#ff8bd7" stroke-width="9" opacity=".55"/>
</g>

<!-- ornate closed story album -->
<g filter="url(#shadow)">
  <rect x="126" y="114" width="250" height="268" rx="38" fill="url(#cover)" stroke="#fff" stroke-width="11"/>
  <rect x="145" y="132" width="212" height="230" rx="29" fill="url(#cover2)" opacity=".88" stroke="#ffe7fb" stroke-width="4"/>
  <path d="M126 169h250M126 326h250" stroke="#fff" stroke-opacity=".35" stroke-width="5"/>
  <rect x="111" y="145" width="34" height="208" rx="17" fill="#7c58da" stroke="#fff" stroke-width="8"/>
  <circle cx="128" cy="190" r="8" fill="url(#gold)"/><circle cx="128" cy="249" r="8" fill="url(#gold)"/><circle cx="128" cy="308" r="8" fill="url(#gold)"/>
</g>

<!-- central badge -->
<g filter="url(#glow)">
  <path d="M251 169l22 36 42 8-29 31 5 43-40-18-39 18 5-43-30-31 42-8z" fill="url(#gold)" stroke="#fff" stroke-width="8"/>
  <circle cx="251" cy="231" r="28" fill="#fff8ff" stroke="#ff8fd8" stroke-width="6"/>
  <path d="M238 231l8 8 19-20" fill="none" stroke="#8068ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- page/ticket accents peeking from book -->
<g filter="url(#shadow)">
  <path d="M337 289l48-17 17 70-47 12z" fill="#fff" stroke="#7be7ff" stroke-width="7"/>
  <path d="M348 302l29-8M352 318l24-7M356 334l19-6" stroke="#b69cff" stroke-width="5" stroke-linecap="round"/>
  <path d="M166 101l22-32 19 34" fill="#ff6fc5" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
</g>

<!-- musical/sparkle details -->
<g filter="url(#glow)">
  <path d="M89 177l7 18 18 7-18 7-7 18-7-18-18-7 18-7zM414 165l7 18 18 7-18 7-7 18-7-18-18-7 18-7zM410 306l6 15 15 6-15 6-6 15-6-15-15-6 15-6z" fill="#fff"/>
  <path d="M83 113l8 20 21 2-16 14 5 21-18-11-19 11 6-21-17-14 22-2z" fill="url(#gold)" stroke="#fff" stroke-width="4"/>
  <path d="M412 100l8 19 20 2-15 13 5 20-18-10-18 10 5-20-15-13 20-2z" fill="#ff7bd0" stroke="#fff" stroke-width="4"/>
  <path d="M397 217v42m0-2c-17-8-29 2-23 12 5 9 23 5 23-12zm22-56v42m0-2c-17-8-29 2-23 12 5 9 23 5 23-12z" fill="url(#cyan)" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
</g>

<!-- Japanese game-logo label -->
<text x="256" y="441" text-anchor="middle" font-family="'Hiragino Maru Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-weight="900" font-size="61" letter-spacing="-4" fill="#fff" stroke="#3f278f" stroke-width="20" paint-order="stroke">ストーリー</text>
<text x="256" y="441" text-anchor="middle" font-family="'Hiragino Maru Gothic ProN','Yu Gothic','Meiryo',sans-serif" font-weight="900" font-size="61" letter-spacing="-4" fill="#fffafd" stroke="#ff80d2" stroke-width="8" paint-order="stroke">ストーリー</text>
</svg>