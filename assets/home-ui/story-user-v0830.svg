  <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f6ecff"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1732a8"/><stop offset=".55" stop-color="#315af4"/><stop offset="1" stop-color="#7f5cff"/></linearGradient>
